name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t camigmar/my-app:latest .

      - name: Push Docker Image
        run: |
          docker push camigmar/my-app:latest

      - name: Add SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: SSH commands to deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USER_SERVER }}@${{ secrets.EC2_HOST }} "
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u camigmar --password-stdin &&
          docker pull camigmar/my-app:latest &&
          docker stop my-app || true &&
          docker rm my-app || true &&
          docker run -d --name my-app \
            -v /mnt/efs:/mnt/efs \
            -p 8080:8080 \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }} \
            -e AZURE_ISSUER_URI=${{ secrets.AZURE_ISSUER_URI }} \
            -e AZURE_JWK_SET_URI=${{ secrets.AZURE_JWK_SET_URI }} \
            camigmar/my-app:latest
          "
