spring.application.name=gestionguias

# Base de datos H2 en memoria (no necesita instalacion externa)
spring.datasource.url=jdbc:h2:mem:gestionguias
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# AWS Credenciales (se actualizan cada sesion de AWS Academy)
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.sessionToken=${AWS_SESSION_TOKEN}
aws.region=us-east-1
aws.s3.bucket=guias-despacho-camicata

# Ruta EFS donde se guardan temporalmente las guias
efs.path=/mnt/efs

# Azure AD B2C - JWT validation
# Reemplazar TENANT y FLOW con los valores reales de tu tenant de Azure
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AZURE_JWK_SET_URI}

# ==============================
# RabbitMQ
# ==============================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin123}

app.rabbitmq.exchange=guias.exchange
app.rabbitmq.queue1=cola.guias
app.rabbitmq.queue2=cola.guias.errores
app.rabbitmq.routingkey1=guias.routingkey
app.rabbitmq.routingkey2=guias.errores.routingkey
